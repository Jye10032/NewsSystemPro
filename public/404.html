<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>NewsSystemPro</title>
  <script>
    // GitHub Pages SPA 重定向解决方案
    // 自动适配根域名和子路径部署
    sessionStorage.redirect = location.href;
    var basePath = location.pathname.replace(/\/404\.html$/, '/') || '/';
    location.replace(location.origin + basePath);
  </script>
</head>

</body>
</html>
